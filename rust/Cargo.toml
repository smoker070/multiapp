[workspace]
resolver = "2"
members = ["crates/multiapp-core", "crates/multiapp-cli", "crates/multiapp-gui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "5"
sysinfo = "0.32"
zip = { version = "2", default-features = false, features = ["deflate"] }
