<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiapp</title>
<style>
  /* Black + dark pink, the palette already used for the macOS installer. Both themes are defined
     as tokens on :root so switching never leaves a colour hard-coded to one of them. */
  :root {
    --bg:#0b0b0d; --panel:#141418; --panel-2:#1c1c22; --line:#2a2a32;
    --text:#f2f2f5; --muted:#8b8b98; --accent:#e0246c; --accent-hover:#f43d83;
    --ok:#31c76a; --warn:#e0a020; --danger:#e04b4b; --shadow:rgba(0,0,0,.5);
  }
  :root[data-theme="light"] {
    --bg:#f6f6f8; --panel:#ffffff; --panel-2:#f0f0f4; --line:#e2e2ea;
    --text:#16161a; --muted:#6b6b78; --accent:#d0165e; --accent-hover:#b31150;
    --ok:#1a9e4b; --warn:#a97300; --danger:#c0392b; --shadow:rgba(0,0,0,.12);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    display:flex; flex-direction:column; user-select:none; -webkit-user-select:none;
  }
  header {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header img { width:26px; height:26px; border-radius:6px; }
  header h1 { font-size:15px; font-weight:650; margin:0; letter-spacing:.2px; flex:1; }
  .icon-btn {
    background:transparent; border:1px solid var(--line); color:var(--muted);
    width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px;
    display:grid; place-items:center;
  }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); }

  .toolbar { display:flex; gap:8px; padding:12px 16px; }
  button.primary {
    background:var(--accent); color:#fff; border:0; border-radius:9px;
    padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; flex:1;
  }
  button.primary:hover { background:var(--accent-hover); }
  button.ghost {
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:9px 14px; font-size:13px; cursor:pointer;
  }
  button.ghost:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }

  main { flex:1; overflow-y:auto; padding:0 16px 16px; }
  .row {
    display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
  }
  .row .meta { flex:1; min-width:0; }
  .row .app { font-weight:600; }
  .row .prof { color:var(--muted); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.run { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent); }
  .dot.unknown { background:var(--warn); }
  .row button { padding:6px 12px; font-size:12px; border-radius:8px; cursor:pointer; }
  .btn-launch { background:var(--accent); color:#fff; border:0; }
  .btn-launch:hover { background:var(--accent-hover); }
  .btn-stop { background:transparent; color:var(--danger); border:1px solid var(--danger); }

  .empty { text-align:center; color:var(--muted); padding:44px 20px; }
  .empty b { display:block; color:var(--text); margin-bottom:6px; font-size:14px; }

  footer {
    border-top:1px solid var(--line); padding:9px 16px; font-size:11px; color:var(--muted);
    display:flex; gap:8px; align-items:center; background:var(--panel);
  }
  #status { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status.err { color:var(--danger); }
  #status.ok  { color:var(--ok); }
  .pin {
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:7px; padding:3px 9px; font-size:11px; cursor:pointer; flex:none;
  }
  .pin:hover { color:var(--accent); border-color:var(--accent); }

  .backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  .backdrop.open { display:flex; }
  .modal {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:100%; max-width:360px; box-shadow:0 18px 50px var(--shadow);
  }
  .modal h2 { margin:0 0 14px; font-size:14px; text-align:center; }
  label { display:block; font-size:11px; color:var(--muted); margin:10px 0 5px; }
  input {
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:13px; user-select:text;
  }
  input:focus { outline:none; border-color:var(--accent); }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; min-height:15px; }
  .hint.bad { color:var(--danger); }
  .hint.good { color:var(--ok); }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions button { flex:1; }
</style>
</head>
<body>
  <header>
    <img src="logo.png" alt="">
    <h1>Multiapp</h1>
    <button class="icon-btn" id="theme" title="Light / dark">◑</button>
  </header>

  <div class="toolbar">
    <button class="primary" id="new">New Profile</button>
    <button class="ghost" id="refresh" title="Refresh">↻</button>
  </div>

  <main id="list"></main>

  <footer>
    <span id="status">Loading…</span>
    <button class="pin" id="pin" hidden title="Add a Multiapp shortcut to the Start Menu">＋ Start Menu</button>
  </footer>

  <div class="backdrop" id="backdrop">
    <div class="modal">
      <h2>New Profile</h2>
      <label for="app">Application</label>
      <input id="app" list="apps" placeholder="Microsoft Edge" autocomplete="off">
      <datalist id="apps"></datalist>
      <div class="hint" id="app-hint"></div>
      <label for="name">Profile name</label>
      <input id="name" placeholder="work" autocomplete="off">
      <div class="hint" id="name-hint"></div>
      <div class="modal-actions">
        <button class="ghost" id="cancel">Cancel</button>
        <button class="primary" id="create">Create</button>
      </div>
    </div>
  </div>

<script>
const invoke = window.__TAURI__.core.invoke;
const $ = id => document.getElementById(id);
let busy = false;

function say(msg, kind = "") { const s = $("status"); s.textContent = msg; s.className = kind; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function refresh() {
  try {
    const rows = await invoke("list_profiles");
    const list = $("list");
    if (!rows.length) {
      list.innerHTML = `<div class="empty"><b>No profiles yet</b>
        Create one to run a second, separate copy of an app —<br>its own login, cookies and settings.</div>`;
      say(await invoke("profiles_root"));
      return;
    }
    list.innerHTML = rows.map((p, i) => {
      // "unknown" is shown as its own state on purpose: it means processes existed that could not be
      // inspected, and calling that "stopped" would be a claim the tool cannot support
      const cls = p.running ? "run" : (p.certain ? "" : "unknown");
      const state = p.running ? "running" : (p.certain ? "stopped" : "unknown");
      const btn = p.running
        ? `<button class="btn-stop" data-act="stop" data-i="${i}">Stop</button>`
        : `<button class="btn-launch" data-act="launch" data-i="${i}">Launch</button>`;
      return `<div class="row"><span class="dot ${cls}" title="${state}"></span>
        <span class="meta"><div class="app">${esc(p.app)}</div>
        <div class="prof">${esc(p.name)} · ${state}</div></span>${btn}</div>`;
    }).join("");
    list.querySelectorAll("button[data-act]").forEach(b => {
      b.onclick = () => act(b.dataset.act, rows[+b.dataset.i]);
    });
    say(`${rows.length} profile${rows.length > 1 ? "s" : ""}`);
  } catch (e) { say(e, "err"); }
}

async function act(kind, p) {
  if (busy) return;
  busy = true;
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    if (kind === "launch") {
      say(`Launching ${p.app} · ${p.name}…`);
      await invoke("launch_profile", { app: p.app, name: p.name });
      say(`Launched ${p.name}`, "ok");
    } else {
      say(`Asking ${p.app} to quit…`);
      const done = await invoke("stop_profile", { app: p.app, name: p.name });
      // A refusal is normal, not an error: multiapp never force-kills, because that loses unsaved work.
      say(done ? `Stopped ${p.name}` : `${p.name} did not exit — quit it from the app itself`,
          done ? "ok" : "err");
    }
  } catch (e) { say(e, "err"); }
  busy = false;
  document.querySelectorAll("button").forEach(b => b.disabled = false);
  setTimeout(refresh, kind === "launch" ? 2500 : 500);
}

$("refresh").onclick = refresh;
$("theme").onclick = () => {
  const r = document.documentElement;
  const next = r.dataset.theme === "dark" ? "light" : "dark";
  r.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (_) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

$("new").onclick = async () => {
  $("backdrop").classList.add("open");
  $("app").value = ""; $("name").value = "";
  $("app-hint").textContent = ""; $("name-hint").textContent = "";
  $("app").focus();
  try {
    const apps = await invoke("detect_apps");
    $("apps").innerHTML = apps.map(a => `<option value="${esc(a.name)}">`).join("");
  } catch (_) {}
};
$("cancel").onclick = () => $("backdrop").classList.remove("open");
$("backdrop").onclick = e => { if (e.target === $("backdrop")) $("cancel").click(); };

let checkTimer;
$("app").oninput = () => {
  clearTimeout(checkTimer);
  const v = $("app").value.trim();
  const h = $("app-hint");
  if (!v) { h.textContent = ""; h.className = "hint"; return; }
  checkTimer = setTimeout(async () => {
    const ok = await invoke("app_exists", { app: v });
    h.textContent = ok ? "found on this machine" : "not found — check the name or paste a full path";
    h.className = ok ? "hint good" : "hint bad";
  }, 250);
};

$("create").onclick = async () => {
  const app = $("app").value.trim(), name = $("name").value.trim();
  if (!app || !name) { $("name-hint").textContent = "Both fields are required."; $("name-hint").className = "hint bad"; return; }
  try {
    await invoke("create_profile", { app, name });
    $("backdrop").classList.remove("open");
    say(`Created ${app} · ${name}`, "ok");
    refresh();
  } catch (e) { $("name-hint").textContent = e; $("name-hint").className = "hint bad"; }
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("backdrop").classList.contains("open")) $("cancel").click();
  if (e.key === "Enter" && $("backdrop").classList.contains("open")) $("create").click();
});

// A portable .exe is registered nowhere by Windows, so it never appears in the Start Menu. Offer it
// as a button rather than doing it silently — and hide the button once the shortcut exists, and on
// platforms where the whole idea does not apply.
(async () => {
  try {
    const already = await invoke("in_start_menu");
    if (!already && navigator.userAgent.includes("Windows")) $("pin").hidden = false;
  } catch (_) {}
})();
$("pin").onclick = async () => {
  try {
    const p = await invoke("add_to_start_menu");
    $("pin").hidden = true;
    say("Added to the Start Menu", "ok");
    console.log("shortcut:", p);
  } catch (e) { say(e, "err"); }
};

refresh();
setInterval(() => { if (!busy && !$("backdrop").classList.contains("open")) refresh(); }, 5000);
</script>
</body>
</html>
