<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiapp</title>
<style>
  /* Black + dark pink, the palette already used for the macOS installer. Both themes are declared as
     tokens on :root, so nothing is ever hard-coded to one of them. */
  :root {
    --bg:#0b0b0d; --panel:#141418; --panel-2:#1c1c22; --panel-3:#24242c; --line:#2a2a32;
    --text:#f2f2f5; --muted:#8b8b98; --accent:#e0246c; --accent-2:#f43d83;
    --ok:#31c76a; --warn:#e0a020; --danger:#e04b4b; --shadow:0 18px 50px rgba(0,0,0,.55);
    --r:11px; --ease:cubic-bezier(.2,.8,.3,1);
  }
  :root[data-theme="light"] {
    --bg:#f5f5f8; --panel:#ffffff; --panel-2:#f0f0f4; --panel-3:#e7e7ee; --line:#e0e0e8;
    --text:#16161a; --muted:#6b6b78; --accent:#d0165e; --accent-2:#b31150;
    --ok:#1a9e4b; --warn:#a2700a; --danger:#c0392b; --shadow:0 18px 40px rgba(0,0,0,.14);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  /* Sidebar of apps, profiles on the right — the shape OrbStack, TablePlus and Parallels
     Control Center all converged on, and the reason is that it scales. The single column this
     replaced put every app, every profile and every tool in one flat list, so the window got
     louder with each profile instead of better organised. */
  body {
    background:var(--bg); color:var(--text);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    display:grid;
    grid-template-columns:var(--side, 232px) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  /* Anyone who has asked the OS to reduce motion gets none of this. */
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

  header {
    grid-column:1 / -1;
    display:flex; align-items:center; gap:10px; padding:13px 15px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  header img { width:26px; height:26px; border-radius:7px; }
  header h1 { font-size:15px; font-weight:650; margin:0; letter-spacing:.2px; flex:1; }

  /* ----------------------------------------------------------------- sidebar */
  aside {
    grid-row:2; grid-column:1; min-height:0;
    display:flex; flex-direction:column; gap:3px; padding:12px 10px;
    background:var(--panel); border-right:1px solid var(--line);
    position:relative;
  }
  /* The sidebar's right edge is draggable. Long app and profile names were cut to "Microsoft E…"
     with no way to widen the column. */
  .grip {
    position:absolute; top:0; right:-4px; width:8px; height:100%; z-index:5;
    cursor:col-resize; touch-action:none;
  }
  .grip::after {
    content:""; position:absolute; top:0; bottom:0; left:3px; width:2px;
    background:transparent; transition:background .16s;
  }
  .grip:hover::after, .grip.drag::after, .grip:focus-visible::after { background:var(--accent); }
  .grip:focus-visible { outline:none; }
  body.resizing { cursor:col-resize; }
  body.resizing * { transition:none !important; }
  .search {
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:8px 11px; font:inherit; font-size:12.5px; margin-bottom:12px;
  }
  .search:focus { outline:none; border-color:var(--accent); }
  .navLabel {
    font-size:10.5px; font-weight:700; letter-spacing:.9px; color:var(--muted);
    padding:0 9px 7px; text-transform:uppercase;
  }
  #appNav { overflow-y:auto; min-height:0; display:flex; flex-direction:column; gap:2px; scrollbar-width:thin; }
  .nav {
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:8px 9px; border-radius:9px; border:1px solid transparent;
    background:transparent; color:var(--text); cursor:pointer; font:inherit;
    transition:background .14s, color .14s;
  }
  .nav:hover { background:var(--panel-2); }
  .nav.on    { background:var(--panel-3); }
  .nav .swatch {
    width:20px; height:20px; border-radius:6px; background:var(--panel-3); flex:none;
    display:grid; place-items:center; font-size:10px; font-weight:700; color:var(--muted);
  }
  .nav.on .swatch { background:var(--accent); color:#fff; }
  .nav .nm { flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav .ct { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  .nav .ct.live { color:var(--ok); font-weight:700; }
  .navFoot { margin-top:auto; padding-top:9px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:2px; }
  /* Visible to a screen reader, not on screen — the search field needs a label either way. */
  /* Picker rows and described actions share one shape: a full-width button with a title and a
     line of explanation. They are buttons, not links in a list, so Tab and Return work. */
  .pick, .act {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; margin-bottom:7px; border-radius:11px; cursor:pointer; font:inherit;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    transition:border-color .16s, background .16s, transform .12s var(--ease);
  }
  .pick:hover, .act:hover { border-color:var(--accent); background:var(--panel-3); }
  .pick:active, .act:active { transform:scale(.99); }
  .pick:focus-visible, .act:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .pick .tile { width:30px; height:30px; border-radius:9px; flex:none; display:grid; place-items:center;
                background:var(--panel-3); color:var(--muted); font-size:12px; font-weight:700; }
  .pick .pn { flex:1; min-width:0; }
  .pick .pn b, .act b { display:block; font-size:13px; font-weight:600;
                        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pick .pn span, .act span { display:block; margin-top:2px; color:var(--muted); font-size:11.5px; line-height:1.4; }
  .pick .go { color:var(--muted); flex:none; font-size:15px; }
  .act { display:block; }
  .acts { margin-top:12px; }
  /* CLI output, shown verbatim. Selectable because the whole point is to copy it into a bug
     report, and scrollable both ways because a path is as long as it is. */
  .report {
    margin:0 0 10px; padding:10px 11px; max-height:220px; overflow:auto;
    background:var(--bg); border:1px solid var(--line); border-radius:9px;
    font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--text); user-select:text; -webkit-user-select:text;
    /* Wrap rather than scroll sideways: the long lines here are filesystem paths, and a
       report you have to drag horizontally to read is a report nobody reads. */
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  /* `hidden` must beat every display rule. `.act { display:block }` outranked the browser's own
     [hidden] rule, so buttons meant for Claude only were shown for every app. */
  [hidden] { display:none !important; }
  /* Tools keeps one size whatever the list holds: searching, paging and rescanning used to
     resize it under the pointer. Only the list area changes; the sheet itself scrolls. */
  .modal.wide.tools { max-width:600px; height:min(88vh, 660px); }
  .busy { position:absolute; left:0; right:0; top:0; height:100%; z-index:3; display:grid; place-items:center;
          background:color-mix(in srgb,var(--panel) 62%,transparent); border-radius:15px; }
  .busy .spinner { font-size:30px; line-height:1; color:var(--accent); animation:spin .9s linear infinite; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

  /* ----------------------------------------------------------------- main header */
  .mainHead { display:flex; flex-wrap:wrap; align-items:flex-start; gap:11px; padding:17px 16px 13px; }
  .mainHead .ttl { flex:1 1 200px; min-width:0; }
  .headBtns { display:flex; gap:11px; flex-wrap:wrap; }
  .mainHead h2 { margin:0 0 4px; font-size:18px; font-weight:680; letter-spacing:-.2px;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mainHead .sub { font-size:12.5px; color:var(--muted); }

  button { font-family:inherit; }
  .btn {
    border-radius:9px; border:1px solid transparent; cursor:pointer;
    font-size:13px; font-weight:600; padding:9px 14px;
    /* A button is as wide as its own label. The previous rule fixed the padding and let the row
       squeeze the box, so "Остановить" and "Переименовать" spilled over their own borders the
       moment the language changed — the labels were never the problem, the fixed box was. */
    white-space:nowrap; flex:none; max-width:100%;
    overflow:hidden; text-overflow:ellipsis;
    transition:transform .12s var(--ease), background .16s, border-color .16s, box-shadow .16s, color .16s;
  }
  .btn:hover  { transform:translateY(-1px); }
  .btn:active { transform:translateY(0) scale(.975); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btn[disabled] { opacity:.45; cursor:default; transform:none !important; }
  .primary { background:var(--accent); color:#fff; box-shadow:0 4px 14px -6px var(--accent); }
  .primary:hover { background:var(--accent-2); box-shadow:0 8px 20px -8px var(--accent); }
  .ghost { background:var(--panel-2); color:var(--text); border-color:var(--line); }
  .ghost:hover { border-color:var(--accent); color:var(--accent); }
  .icon {
    background:transparent; border:1px solid var(--line); color:var(--muted);
    width:31px; height:31px; border-radius:9px; cursor:pointer; font-size:14px;
    display:grid; place-items:center; flex:none;
    transition:transform .12s var(--ease), color .16s, border-color .16s, background .16s;
  }
  /* No rotation. A control that tilts when the pointer nears it reads as a toy, not a tool —
     and a 6deg turn on a 31px square is the single thing people named first about this window. */
  .icon:hover  { color:var(--accent); border-color:var(--accent); background:var(--panel-2); }
  .icon:active { transform:scale(.96); }
  .icon.spin   { animation:spin .7s linear infinite; }
  .icon { position:relative; }
  .badge {
    position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 4px;
    border-radius:8px; background:var(--accent); color:#fff; font-size:9.5px; font-weight:700;
    display:grid; place-items:center; line-height:1; pointer-events:none;
    box-shadow:0 0 0 2px var(--panel); animation:pop .2s var(--ease);
  }
  .arow .kind { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none;
                background:var(--panel-3); color:var(--muted); font-size:13px; }
  .arow .kind.profile  { color:var(--accent); }
  .arow .kind.sessions { color:var(--ok); }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Only the list scrolls. The app name, the counts and the two actions belong to the pane, not
     to the list, so they stay put while you scroll through forty profiles. */
  main { grid-row:2; grid-column:2; min-height:0; display:flex; flex-direction:column; }
  #list { flex:1; min-height:0; overflow-y:auto; padding:0 16px 14px; scrollbar-width:thin; }
  #list::-webkit-scrollbar, #appNav::-webkit-scrollbar { width:9px; }
  #list::-webkit-scrollbar-thumb, #appNav::-webkit-scrollbar-thumb {
    background:var(--panel-3); border-radius:9px; border:3px solid var(--bg);
  }

  /* 15px of gap and 15px of padding, against the 10/10 this replaced. The complaint was that the
     controls sat on top of each other; the fix is partly space, but mostly that a row now carries
     ONE primary action plus an overflow menu instead of five buttons of equal weight. */
  .row {
    display:flex; align-items:center; gap:15px; padding:14px 15px; margin-bottom:9px;
    background:var(--panel); border:1px solid var(--line); border-radius:13px;
    transition:border-color .16s, transform .14s var(--ease), box-shadow .16s;
  }
  .row:hover { border-color:var(--panel-3); transform:translateY(-1px); box-shadow:0 6px 18px -12px rgba(0,0,0,.7); }
  .row .tile {
    width:36px; height:36px; border-radius:11px; flex:none;
    background:var(--panel-3); color:var(--muted);
    display:grid; place-items:center; font-size:14px; font-weight:700;
  }
  .row.live .tile { background:var(--accent); color:#fff; }
  /* Only rows that are genuinely new animate in. The list is polled every few seconds to keep the
     running state honest, and replaying the entrance on every poll made the whole list flicker. */
  .row.fresh { animation:rise .26s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
  .row .meta { flex:1; min-width:0; }
  .row .app  { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* The status dot now sits with the word it qualifies, instead of floating at the row's edge
     where it was a coloured speck you had to learn the meaning of. */
  .row .sub  { color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
               display:flex; align-items:center; gap:6px; margin-top:3px; }
  .row.live .sub { color:var(--ok); font-weight:600; }
  /* The size is secondary to the state, so it does not take the running colour with it. */
  .row .sep, .row .psz { color:var(--muted); font-weight:400; }
  .row .psz { font-variant-numeric:tabular-nums; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; transition:background .2s; }
  .dot.run { background:var(--ok); animation:pulse 2.2s ease-in-out infinite; }
  .dot.unknown { background:var(--warn); }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent); }
    70%     { box-shadow:0 0 0 6px transparent; }
  }
  .row .btn { padding:6px 12px; font-size:12px; }
  .stop { background:transparent; color:var(--danger); border-color:var(--danger); }

  /* A row's action is quiet until you are on the row.
     Every stopped profile offering a solid accent button meant a list of six was six competing
     calls to action and no hierarchy — the "wall of buttons" look. The action still reads as a
     button at rest; it only takes the accent once the row is hovered or the button is focused,
     which is the moment it is actually a choice. Keyboard users get it from :focus-within. */
  .row .btn.primary { background:var(--panel-2); color:var(--text); border-color:var(--line); box-shadow:none; }
  .row:hover .btn.primary,
  .row:focus-within .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row .btn.primary:focus-visible { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stop:hover { background:var(--danger); color:#fff; }

  /* The row menu lives at BODY level, not inside the row.
     Inside the list it was both overlapped and clippable: `main` has overflow-y:auto, so a menu
     extending past the row is cut off, and rows that animate in briefly form their own stacking
     contexts, letting a LATER row paint over an earlier row's open menu. position:fixed on a
     body-level element has neither problem, and it keeps working while the list scrolls. */
  .menu {
    /* above the list, BELOW the dialog backdrop (60): a dialog must cover everything. */
    position:fixed; z-index:50; min-width:176px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px;
    box-shadow:var(--shadow); padding:5px; display:none;
    transform-origin:top right; animation:pop .16s var(--ease);
  }
  .menu.open { display:block; }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(-4px); } to { opacity:1; transform:none; } }
  .menu button {
    display:block; width:100%; text-align:left; background:transparent; border:0; color:var(--text);
    padding:7px 10px; border-radius:7px; font-size:12.5px; cursor:pointer; transition:background .12s, color .12s;
  }
  .menu button:hover { background:var(--panel-3); }
  .menu button.danger { color:var(--danger); }
  .menu button.danger:hover { background:var(--danger); color:#fff; }
  .menu hr { border:0; border-top:1px solid var(--line); margin:5px 2px; }

  .empty { text-align:center; color:var(--muted); padding:40px 18px; animation:rise .3s var(--ease) both; }
  .empty b { display:block; color:var(--text); margin-bottom:6px; font-size:14px; }

  footer {
    grid-column:1 / -1;
    border-top:1px solid var(--line); padding:8px 15px; font-size:11px; color:var(--muted);
    display:flex; gap:8px; align-items:center; background:var(--panel);
  }
  #status { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .2s; }
  #status.err { color:var(--danger); } #status.ok { color:var(--ok); }
  .pin { background:transparent; border:1px solid var(--line); color:var(--muted);
         border-radius:7px; padding:3px 9px; font-size:11px; cursor:pointer; flex:none;
         transition:color .16s, border-color .16s, transform .12s var(--ease); }
  .pin:hover { color:var(--accent); border-color:var(--accent); transform:translateY(-1px); }

  /* Opens AND closes with the same motion.
     This was `display:none` plus an entrance keyframe: the sheet appeared with a flicker and
     vanished instantly, blur and all. A dialog that only animates one way reads as a glitch.
     visibility is transitioned with a delay so the sheet stays hittable until the fade finishes. */
  .backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,0); backdrop-filter:blur(0px);
    display:flex; align-items:center; justify-content:center; padding:18px; z-index:60;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .26s ease, background .26s ease, backdrop-filter .26s ease,
               visibility 0s linear .26s;
  }
  .backdrop.open {
    opacity:1; visibility:visible; pointer-events:auto;
    background:rgba(0,0,0,.5); backdrop-filter:blur(7px);
    transition:opacity .26s ease, background .26s ease, backdrop-filter .26s ease,
               visibility 0s linear 0s;
  }
  .backdrop.open { display:flex; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .modal {
    background:var(--panel); border:1px solid var(--line); border-radius:15px;
    padding:17px; width:100%; max-width:352px; box-shadow:var(--shadow);
    max-height:88vh; overflow-y:auto; position:relative;
    opacity:0; transform:translateY(10px) scale(.975);
    transition:opacity .26s ease, transform .26s var(--ease);
  }
  .backdrop.open .modal { opacity:1; transform:none; }

  /* A way out that is always visible. Every sheet has a Close button in its actions row, but a
     tall sheet scrolls it off the bottom, so the only exit people found was clicking outside. */
  .modal .x {
    position:absolute; top:11px; right:11px; width:28px; height:28px; border-radius:8px;
    display:grid; place-items:center; cursor:pointer; z-index:2;
    background:transparent; border:1px solid transparent; color:var(--muted);
    font:inherit; font-size:15px; line-height:1;
    transition:background .16s, color .16s, border-color .16s;
  }
  .modal .x:hover { background:var(--panel-2); color:var(--text); border-color:var(--line); }
  .modal .x:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .modal h2 { padding-right:34px; }
  @keyframes zoom { from { opacity:0; transform:scale(.95) translateY(8px); } to { opacity:1; transform:none; } }
  .modal h2 { margin:0 0 13px; font-size:14px; text-align:center; }
  label { display:block; font-size:11px; color:var(--muted); margin:11px 0 5px; }
  input, select {
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:13px; font-family:inherit;
    user-select:text; transition:border-color .16s, box-shadow .16s;
  }
  input:focus, select:focus {
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);
  }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; min-height:15px; transition:color .2s; }
  .hint.bad { color:var(--danger); } .hint.good { color:var(--ok); }
  .actions { display:flex; gap:8px; margin-top:15px; }
  .actions .btn { flex:1; }

  .seg { display:flex; gap:6px; }
  .seg button {
    flex:1; padding:8px 0; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;
    transition:all .16s var(--ease);
  }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .seg button:active { transform:scale(.96); }

  .adv { margin-top:14px; padding-top:13px; border-top:1px solid var(--line); }
  .adv h3 { font-size:11px; color:var(--muted); margin:0 0 8px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
  .adv .grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .adv .grid .btn { padding:8px 6px; font-size:12px; font-weight:600; }
  .note { font-size:11px; color:var(--muted); line-height:1.5; margin-top:9px; }
  /* The actions WRAP. Two buttons (Trash rows) stay on the name's line; four (the backup rows)
     drop to a second line instead of crushing the name. Without wrapping, `.n` was squeezed to a
     few pixels and its description rendered one word per line, behind the buttons. */
  .arow {
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:11px 12px; margin-bottom:8px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px;
    animation:rise .22s var(--ease) both; transition:border-color .16s;
  }
  .arow:hover { border-color:var(--panel-3); }
  /* The name owns the first line; every action shares the second. Letting them compete for one
     line is what produced the unreadable row, and it would come back the moment a label got
     longer in another language. */
  .arow .n { flex:1 1 180px; min-width:0; }
  /* Tools rows: the actions sit together on the right of the name. */
  .arow .ra { display:flex; gap:6px; margin-left:auto; flex:none; }
  .arow .rs { flex:1 1 100%; font-size:11.5px; margin:0; }
  .arow .rs:empty { display:none; }
  #bkMenu { z-index:70; }   /* opened from inside the Tools dialog, so it sits above its backdrop */
  .arow .n b { display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Direct child only. `.arow .n span` also matched the nested size span and turned it into a
     block, which is what split "local web data ·" and "116.9 MB" onto separate lines. */
  .arow .n > span { display:block; margin-top:2px; color:var(--muted); font-size:11.5px;
                    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .arow .n .sz { display:inline; }
  .arow .btn { padding:6px 11px; font-size:11.5px; }
  /* session picker */
  .xfer { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px) { .xfer { grid-template-columns:1fr; } }
  .xfer .side { min-width:0; }
  .xfer select.acct { margin-top:6px; font-size:12px; padding:7px 9px; color:var(--muted); }
  .xfer select.acct.need { border-color:var(--warn); color:var(--text); }
  .slist {
    margin-top:9px; max-height:210px; overflow-y:auto; padding:5px;
    border:1px solid var(--line); border-radius:10px; background:var(--panel-2);
  }
  .srow { display:flex; gap:8px; align-items:flex-start; padding:6px 7px; border-radius:8px;
          cursor:pointer; transition:background .12s; }
  .srow:hover { background:var(--panel-3); }
  .srow input { width:auto; margin:2px 0 0; accent-color:var(--accent); flex:none; }
  .srow .st { flex:1; min-width:0; }
  .srow .st b { display:block; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow .st span { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .linkbtn { background:none; border:0; color:var(--accent); font-size:11px; cursor:pointer;
             padding:0; font-family:inherit; }
  .linkbtn:hover { text-decoration:underline; }

  pre {
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:10px;
    font-size:11px; max-height:230px; overflow:auto; white-space:pre-wrap; word-break:break-word;
    user-select:text; margin:0;
  }
  /* ------------------------------------------------------------------ no inline styles
     Everything below used to be an inline style attribute. The packaged app runs under a
     Content-Security-Policy that carries a nonce for the stylesheet, and a nonce makes the
     browser ignore 'unsafe-inline' — so every style attribute was silently dropped in the real
     window while rendering perfectly in a plain browser. Sheets came out at the base width,
     the Delete buttons were not red, icon tiles kept their background. Classes are not optional
     here; a test in main.rs fails the build if a style attribute comes back. */
  .swatch.bare { background:none; }
  .btn.small { padding:5px 10px; font-size:11px; }
  .btn.danger, .btn.danger:hover { background:var(--danger); border-color:var(--danger); box-shadow:none; color:#fff; }
  .modal.mid  { max-width:440px; }
  .modal.wide { max-width:500px; }
  .selectable { user-select:text; -webkit-user-select:text; }
  .tight-actions { margin:0 0 8px; }
  .mt12 { margin-top:12px; }
  .center { text-align:center; }
  .between { display:flex; align-items:center; justify-content:space-between; margin-top:11px; }
  .m0 { margin:0; }
  .m6 { margin:6px; }

  /* Narrow window: the sidebar is the first thing to go, not the content.
     This block lives at the END of the stylesheet on purpose. A media query carries no extra
     specificity, so while it sat above `aside { display:flex }` the plain rule won on source
     order and the breakpoint silently did nothing — the sidebar stayed put at every width. */
  @media (max-width:560px) {
    body { grid-template-columns:minmax(0,1fr); }
    aside { display:none; }
    /* main is pinned to column 2 for the two-column layout. Leaving it pinned here put it in an
       IMPLICIT third track and left the empty explicit column showing as a dead strip down the
       side of the window — which is exactly what the app did on first launch. */
    main { grid-column:1; }
  }
</style>
</head>

  <header>
    <img src="logo.png" alt="">
    <h1>Multiapp</h1>
    <!-- Trash and Settings moved into the sidebar's foot, where they are named rather than
         guessed at from a glyph. Only Rescan stays here: it acts on the window, not on a list. -->
    <button class="icon" id="refresh" title="Rescan">↻</button>
  </header>

  <aside>
    <label class="sr" for="q" data-i18n="searchLabel">Search apps and profiles</label>
    <input class="search" id="q" type="search" autocomplete="off" placeholder="Search">

    <div id="appNav"></div>
    <div class="navFoot">

        <span class="nm" data-i18n="trash">Trash</span>
        <span class="ct" id="trashBadge" hidden></span>
      </button>
      <button class="nav" id="settings">
        <svg class="swatch bare" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="nm" data-i18n="settings">Settings</span>
      </button>
    </div>
    <div class="grip" id="sideGrip" role="separator" aria-orientation="vertical" tabindex="0"></div>
  </aside>

  <main>
    <div class="mainHead">
      <div class="ttl">
        <h2 id="paneTitle">Multiapp</h2>
        <div class="sub" id="paneSub"></div>
      </div>
      <div class="headBtns">
        <button class="btn ghost" id="advBtn" data-i18n="tools">Tools</button>
        <button class="btn primary" id="new" data-i18n="newProfile">New Profile</button>
      </div>
    </div>
    <div id="list"></div>
  </main>

  <footer>
    <span id="status">…</span>
    <button class="pin" id="pin" hidden data-i18n="addStart">＋ Start Menu</button>
  </footer>

  <!-- New / rename / clone all reuse one dialog: same shape, different verb -->
  <!-- One "Back up" button per app row opens this; the three kinds live here, not as three buttons. -->
  <div class="menu" id="bkMenu">
    <button data-scope="login" data-i18n="mLogin">Login only</button>
    <button data-scope="sessions" data-i18n="mSess">Sessions, without login</button>
    <button data-scope="everything" data-i18n="mAll">Everything</button>
  </div>
  <div class="menu" id="rowMenu">
    <button data-act="reveal" data-i18n="openFolder">Open folder</button>
    <button data-act="rename" data-i18n="rename">Rename</button>
    <button data-act="clone"  data-i18n="clone">Clone</button>
    <button data-act="export" data-i18n="exportProfile">Export to file…</button>
    <hr>
    <button class="danger" data-act="delete" data-i18n="delete">Delete</button>
  </div>

  <div class="backdrop" id="bdProfile">
    <div class="modal">
      <h2 id="pTitle">New Profile</h2>
      <div id="appRow">
        <label for="app" data-i18n="application">Application</label>
        <input id="app" list="apps" placeholder="Microsoft Edge" autocomplete="off">
        <datalist id="apps"></datalist>
        <div class="hint" id="appHint"></div>
      </div>
      <label for="pname" data-i18n="profileName">Profile name</label>
      <input id="pname" placeholder="work" autocomplete="off">
      <div class="hint" id="nameHint"></div>
      <div class="actions">
        <button class="btn ghost" id="pCancel" data-i18n="cancel">Cancel</button>
        <button class="btn primary" id="pOk" data-i18n="create">Create</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="bdConfirm">
    <div class="modal">
      <h2 id="cTitle">Delete profile</h2>
      <div class="note" id="cBody"></div>
      <div class="actions">
        <button class="btn ghost" id="cCancel" data-i18n="cancel">Cancel</button>
        <button class="btn primary danger" id="cOk" data-i18n="delete">Delete</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="bdSettings">
    <div class="modal mid">
      <h2 data-i18n="settings">Settings</h2>
      <label data-i18n="theme">Theme</label>
      <div class="seg" id="themeSeg">
        <button data-v="dark"   data-i18n="dark">Dark</button>
        <button data-v="light"  data-i18n="light">Light</button>
        <button data-v="system" data-i18n="system">System</button>
      </div>
      <label data-i18n="language">Language</label>

        <button data-v="uz">O‘zbek</button>
        <button data-v="ru">Русский</button>

      <div class="note selectable" id="rootPath"></div>
      <div class="actions"><button class="btn ghost" id="sClose" data-i18n="close">Close</button></div>
    </div>
  </div>

  <div class="backdrop" id="bdTools">
    <div class="modal wide tools">
      <!-- Rescan keeps the sheet exactly as it is and spins over it; emptying the list made the
           whole sheet collapse and grow back, which read as a glitch. -->
      <div class="busy" id="toolsBusy" hidden><span class="spinner" aria-hidden="true">↻</span><span class="sr" data-i18n="scanning">Scanning…</span></div>

      <div class="note" data-i18n="backupNote"></div>
      <div class="actions mt12">
        <button class="btn ghost" id="bRestore" data-i18n="restoreFrom">Restore from file…</button>
        <button class="btn ghost" id="bRescan" data-i18n="rescan">Rescan</button>
      </div>
      <label class="sr" for="tFind" data-i18n="findApp">Find an app</label>
      <input class="search mt12" id="tFind" type="search" autocomplete="off">
      <div id="appList"></div>
      <div class="note center" id="appMore"></div>
      <div class="hint" id="bStatus"></div>
      <div class="actions"><button class="btn ghost" id="tClose" data-i18n="close">Close</button></div>
    </div>
  </div>


  <!-- Trash: every deletion in Multiapp is a move into here, so this is where "what did I delete?"
       is answered, where a profile comes back, and the only place anything is erased for good. -->
  <div class="backdrop" id="bdTrash">
    <div class="modal mid">
      <h2 data-i18n="trash">Trash</h2>
      <div class="note" data-i18n="trashNote"></div>
      <div id="trashList" class="mt12"></div>
      <div class="hint" id="trashStatus"></div>
      <div class="actions">
        <button class="btn ghost" id="trashClose" data-i18n="close">Close</button>
        <button class="btn primary danger" id="trashEmpty" data-i18n="emptyTrash">Empty Trash</button>
      </div>
    </div>
  </div>

  <!-- Claude Code sessions. macOS only, and only when the CLI is installed: the id-minting and
       transcript duplication live there, not in this app. -->
  <div class="backdrop" id="bdSessions">
    <div class="modal mid">
      <h2 data-i18n="sessionsTitle">Claude Code sessions</h2>
      <div class="note" data-i18n="sessionsNote"></div>
      <div class="note" data-i18n="onlyClaude"></div>

           Claude shows only the signed-in one — so "main → main" is a real transfer, between them. -->
      <div class="xfer">
        <div class="side">
          <label for="sFrom" data-i18n="from">From</label>
          <select id="sFrom"></select>
          <select id="sFromAcct" class="acct"></select>
        </div>
        <div class="side">
          <label for="sTo" data-i18n="to">To</label>
          <select id="sTo"></select>
          <select id="sToAcct" class="acct"></select>
        </div>
      </div>

      <div class="between">
        <label class="m0" id="sCount"></label>
        <button class="linkbtn" id="sAll" data-i18n="selectAll">Select all</button>
      </div>
      <div class="slist" id="sList"></div>
      <div class="hint" id="sStatus"></div>
      <div class="actions">
        <button class="btn primary" id="sTransfer" data-i18n="transfer">Transfer</button>
        <button class="btn ghost" id="sExport" data-i18n="exportSel">Export…</button>
        <button class="btn ghost" id="sImport" data-i18n="importFile">Import…</button>
      </div>
      <div class="actions">
        <button class="btn ghost" id="sBack">‹ <span data-i18n="back">Back</span></button>
        <button class="btn ghost" id="sDone" data-i18n="close">Close</button>
      </div>
    </div>
  </div>

let lang = "en";
const t = k => (T[lang] && T[lang][k]) || T.en[k] || k;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  // A placeholder is an attribute, not text, so the sweep above cannot reach it.
  $("q").placeholder = t("search");
  $("tFind").placeholder = t("findApp");
  $("sideGrip").title = t("resizeSide");
  render();   // same data, new words: render() animates nothing because the keys are unchanged
}

/* ---------------------------------------------------------------- theme */
function applyTheme(v) {
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  document.documentElement.dataset.theme = v === "system" ? (media.matches ? "dark" : "light") : v;
}
function loadPrefs() {
  try {
    lang = localStorage.getItem("lang") || "en";
    const th = localStorage.getItem("theme") || "dark";
    applyTheme(th);
    mark("themeSeg", th); mark("langSeg", lang);
  } catch (_) { applyTheme("dark"); }
}
function mark(segId, v) {
  $(segId).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
}
// follow the OS while "system" is selected
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  try { if ((localStorage.getItem("theme") || "dark") === "system") applyTheme("system"); } catch (_) {}
});

/* ---------------------------------------------------------------- helpers */
// Entrance stagger for generated rows. Set through the CSSOM because a style attribute in
// generated markup is dropped by the app's CSP; a property assignment is not.
function stagger(root, sel, stepMs, cap) {
  root.querySelectorAll(sel).forEach((el, i) => { el.style.animationDelay = `${Math.min(i, cap) * stepMs}ms`; });
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function say(msg, kind = "") { const s = $("status"); s.textContent = msg; s.className = kind; }
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function closeMenus() {
  for (const id of ["rowMenu", "bkMenu"]) { const m = $(id); if (m) m.classList.remove("open"); }
  openMenu = null; bkRow = null;
}
document.addEventListener("click", closeMenus);
// a fixed menu does not travel with the list, so close it rather than leave it stranded
window.addEventListener("resize", closeMenus);
document.addEventListener("scroll", closeMenus, true);

/// Put the menu under the button that opened it, flipping above when there is no room below.
function openRowMenu(btn, row) {
  placeMenu($("rowMenu"), btn);
  openMenu = row;
}
function placeMenu(m, btn) {
  m.classList.add("open");
  const b = btn.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  let left = Math.min(b.right - w, window.innerWidth - w - 8);
  left = Math.max(8, left);
  const below = b.bottom + 6;
  const top = (below + h > window.innerHeight - 8) ? Math.max(8, b.top - h - 6) : below;
  m.style.left = `${left}px`;
  m.style.top  = `${top}px`;
  m.style.transformOrigin = (top < b.top) ? "bottom right" : "top right";
}

$("rowMenu").onclick = e => {
  e.stopPropagation();
  const b = e.target.closest("button[data-act]");
  if (!b || !openMenu) return;
  const target = openMenu;
  closeMenus();
  act(b.dataset.act, target, b);
};

/* ---------------------------------------------------------------- list */
// null = every app. Survives a refresh; cleared when the chosen app loses its last profile.
let picked = null, query = "";

const matches = p => {
  const q = query.trim().toLowerCase();
  return !q || p.app.toLowerCase().includes(q) || p.name.toLowerCase().includes(q);
};
const initials = s => (s.match(/\p{L}\p{M}*/gu) || ["?"])[0].toUpperCase();

/// The sidebar is derived from the profile list, never stored alongside it — one source of truth,
/// so an app cannot linger in the sidebar after its last profile is deleted.
function renderNav() {
  const visible = rows.filter(matches);
  const byApp = new Map();
  for (const p of visible) {
    const e = byApp.get(p.app) || { n: 0, live: 0 };
    e.n++; if (p.running) e.live++;
    byApp.set(p.app, e);
  }
  // Forget the selection only when the app itself is gone — checked against every profile, not
  // against the search results. Checking the filtered set meant typing a query that matched
  // nothing silently dropped you back to "All apps", and clearing the box did not bring you back.
  if (picked !== null && !rows.some(p => p.app === picked)) picked = null;

  const live = visible.filter(p => p.running).length;
  const all = `<button class="nav${picked === null ? " on" : ""}" data-app="">
      <span class="swatch" aria-hidden="true">\u2217</span><span class="nm">${esc(t("allApps"))}</span>
      <span class="ct${live ? " live" : ""}">${visible.length}</span></button>`;

  $("appNav").innerHTML = all + [...byApp.entries()]
    .sort((a, b) => a[0].toLowerCase().localeCompare(b[0].toLowerCase()))
    .map(([app, e]) => `<button class="nav${picked === app ? " on" : ""}" data-app="${esc(app)}">
        <span class="swatch" aria-hidden="true">${esc(initials(app))}</span><span class="nm" title="${esc(app)}">${esc(app)}</span>
        <span class="ct${e.live ? " live" : ""}">${e.live ? `${e.live}/${e.n}` : e.n}</span></button>`).join("");

  $("appNav").querySelectorAll("[data-app]").forEach(b => {
    b.onclick = () => { picked = b.dataset.app || null; render(); };
  });
  return visible;
}

function render() {
  const visible = renderNav();
  const shown = picked === null ? visible : visible.filter(p => p.app === picked);
  const live = shown.filter(p => p.running).length;

  $("paneTitle").textContent = picked === null ? t("allApps") : picked;
  $("paneSub").textContent = rows.length
    ? `${shown.length} ${shown.length === 1 ? t("profile") : t("profiles")}` +
      (live ? ` · ${live} ${t("running").toLowerCase()}` : "")
    : "";

  const list = $("list");
  if (!shown.length) {
    const empty = rows.length
      ? `<div class="empty"><b>${esc(t("noMatch"))}</b>${esc(t("noMatchBody"))}</div>`
      : `<div class="empty"><b>${esc(t("noneTitle"))}</b>${esc(t("noneBody"))}</div>`;
    list.innerHTML = empty;
    say(rows.length ? t("noMatch") : "");
    return;
  }

  list.innerHTML = shown.map((p, i) => {
    // "unknown" stays its own state: it means processes existed that could not be inspected, and
    // calling that "stopped" would be a claim the tool cannot support
    const cls   = p.running ? "run" : (p.certain ? "" : "unknown");
    const state = p.running ? t("running") : (p.certain ? t("stopped") : t("unknown"));
    // One primary action per row. Everything else lives behind the menu, because five buttons of
    // equal weight side by side is not a choice, it is a wall.
    const main  = p.running
      ? `<button class="btn stop" data-act="stop" data-i="${i}">${esc(t("stop"))}</button>`
      : `<button class="btn primary" data-act="launch" data-i="${i}">${esc(t("launch"))}</button>`;
    const fresh = shownKeys.has(keyOf(p)) ? "" : " fresh";
    // With an app selected its name is already the pane title, so the row leads with the profile.
    const lead = picked === null ? `${p.app} · ${p.name}` : p.name;
    // A known size is painted straight away; only an unmeasured profile shows the placeholder,
    // so switching apps or retyping a search never puts "measuring…" back on a row you have
    // already seen the number for.
    const k = keyOf(p);
    const sz = sizeCache.has(k) ? sizeText(sizeCache.get(k)) : t("measuring");
    return `<div class="row${p.running ? " live" : ""}${fresh}">
      <span class="tile" aria-hidden="true">${esc(initials(p.app))}</span>
      <span class="meta"><div class="app">${esc(lead)}</div>
        <div class="sub"><span class="dot ${cls}"></span>${esc(state)}
          <span class="sep">·</span><span class="psz" data-psz="${i}">${esc(sz)}</span></div></span>
      ${main}
      <button class="icon" data-act="menu" data-i="${i}" aria-label="${esc(t("moreActions"))}">⋯</button></div>`;
  }).join("");

  stagger(list, ".row", 22, 8);
  list.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); act(b.dataset.act, shown[+b.dataset.i], b); };
  });
  measureProfiles(shown);
  shownKeys = new Set(rows.map(keyOf));
  say(`${rows.length} ${rows.length === 1 ? t("profile") : t("profiles")}`);
}

// How big each profile is on disk. Measured the same way the backup list learned to do it: after
// the rows are drawn, one profile at a time, because a profile is a browser data directory and
// Claude's runs to gigabytes. Results are cached by profile so re-rendering costs nothing; ↻
// clears the cache when you want the numbers taken again.
const sizeCache = new Map();
const sizeText = b => (b == null ? "—" : human(b));   // unreadable is not zero

async function measureProfiles(list) {
  const token = ++measureProfiles.run;
  for (let i = 0; i < list.length; i++) {
    const p = list[i], k = keyOf(p);
    if (sizeCache.has(k)) continue;
    let bytes = null;
    try {
      bytes = await invoke("profile_size", { app: p.app, name: p.name });
    } catch { /* a profile we cannot read still gets a row, just no number */ }
    if (token !== measureProfiles.run) return;   // a newer render owns the list now
    sizeCache.set(k, bytes);
    const el = document.querySelector(`[data-psz="${i}"]`);
    if (el) el.textContent = sizeText(bytes);
  }
}
measureProfiles.run = 0;

async function refresh(force = false) {
  try {
    const next = await invoke("list_profiles");
    const sig = sigOf(next);
    if (!force && sig === shownSig) return;   // nothing changed — leave the DOM alone
    shownSig = sig;
    rows = next;
    render();
  } catch (e) { say(e, "err"); }
}

function lock(on) {
  busy = on;
  document.querySelectorAll(".btn,.icon").forEach(b => { b.disabled = on; });
  $("refresh").classList.toggle("spin", on);
}

async function act(kind, p, el) {
  if (kind === "menu") {
    const wasOpen = $("rowMenu").classList.contains("open") && openMenu === p;
    closeMenus();
    if (!wasOpen) openRowMenu(el, p);
    return;
  }
  closeMenus();
  if (busy) return;
  if (kind === "rename" || kind === "clone") return openProfileDialog(kind, p);
  if (kind === "delete") return confirmDelete(p);
  if (kind === "export") return exportProfile(p);

  lock(true);
  try {
    if (kind === "launch") {
      say(`${t("launching")} ${p.app} · ${p.name}…`);
      await invoke("launch_profile", { app: p.app, name: p.name });
      say(`${t("launching")} ${p.name}`, "ok");
    } else if (kind === "stop") {
      say(t("quitting"));
      const done = await invoke("stop_profile", { app: p.app, name: p.name });
      // a refusal is normal, not an error: multiapp never force-kills
      say(done ? `${t("stoppedMsg")} ${p.name}` : `${p.name} ${t("notExit")}`, done ? "ok" : "err");
    } else if (kind === "reveal") {
      await invoke("reveal_profile", { app: p.app, name: p.name });
    }
  } catch (e) { say(e, "err"); }
  lock(false);
  setTimeout(() => refresh(), kind === "launch" ? 2500 : 600);
}

/* ---------------------------------------------------------------- dialogs */
let mode = "new", target = null;
function openProfileDialog(kind, p) {
  closeMenus();
  mode = kind; target = p || null;
  $("pTitle").textContent = kind === "new" ? t("newProfile") : kind === "rename" ? t("rename") : t("clone");
  $("pOk").textContent    = kind === "new" ? t("create")     : kind === "rename" ? t("rename") : t("clone");
  $("appRow").hidden = kind !== "new";
  $("app").value = p ? p.app : "";
  $("pname").value = kind === "clone" && p ? `${p.name} 2` : (kind === "rename" && p ? p.name : "");
  $("appHint").textContent = ""; $("nameHint").textContent = "";
  $("bdProfile").classList.add("open");
  setTimeout(() => (kind === "new" ? $("app") : $("pname")).focus(), 40);
  if (kind === "new") invoke("detect_apps").then(a => {
    $("apps").innerHTML = a.map(x => `<option value="${esc(x.name)}">`).join("");
  }).catch(() => {});
}
$("new").onclick = () => openProfileDialog("new", null);

// Every sheet gets a close button, injected once rather than written into six copies of the
// markup — a new sheet then cannot ship without one. Clicking the dimmed area closes too, but
// that is a shortcut people have to guess; this is the affordance.
for (const bd of document.querySelectorAll(".backdrop")) {
  const modal = bd.querySelector(".modal");
  if (!modal || modal.querySelector(".x")) continue;
  const x = document.createElement("button");
  x.className = "x";
  x.type = "button";
  x.setAttribute("aria-label", t("close"));
  x.textContent = "\u2715";
  x.onclick = () => bd.classList.remove("open");
  modal.prepend(x);
}
// Clicking the dimmed area closes; clicking inside the sheet must not.
for (const bd of document.querySelectorAll(".backdrop")) {
  bd.addEventListener("mousedown", e => { if (e.target === bd) bd.classList.remove("open"); });
}

// Filtering is local to what is already loaded, so it costs nothing and needs no debounce.
$("q").oninput = e => { query = e.target.value; render(); };
$("q").onkeydown = e => {
  if (e.key !== "Escape" || !e.target.value) return;

$("pOk").onclick = async () => {

    $("nameHint").textContent = t("bothRequired"); $("nameHint").className = "hint bad"; return;

    else if (mode === "rename") { await invoke("rename_profile", { app, old: target.name, new: name }); say(`${t("renamed")} → ${name}`, "ok"); }

/* ---------------------------------------------------------------- sidebar width */
// Drag the edge, or focus it and use ← →. Double-click puts it back. Remembered per machine.
const SIDE_MIN = 170, SIDE_DEFAULT = 232;
const sideMax = () => Math.max(SIDE_MIN, Math.min(480, innerWidth - 340));
function setSide(w, save = true) {
  w = Math.round(Math.max(SIDE_MIN, Math.min(sideMax(), w)));
  document.body.style.setProperty("--side", `${w}px`);
  $("sideGrip").setAttribute("aria-valuenow", w);
  if (save) try { localStorage.setItem("sideW", String(w)); } catch (_) {}
}
try { const w = +localStorage.getItem("sideW"); if (w) setSide(w, false); } catch (_) {}
$("sideGrip").onpointerdown = e => {
  const g = $("sideGrip"), left = document.querySelector("aside").getBoundingClientRect().left;
  g.setPointerCapture(e.pointerId); g.classList.add("drag"); document.body.classList.add("resizing");
  g.onpointermove = m => setSide(m.clientX - left, false);
  g.onpointerup = m => {
    g.onpointermove = g.onpointerup = null;
    g.classList.remove("drag"); document.body.classList.remove("resizing");
    setSide(m.clientX - left);
  };
  e.preventDefault();
};
$("sideGrip").ondblclick = () => setSide(SIDE_DEFAULT);
$("sideGrip").onkeydown = e => {
  const cur = document.querySelector("aside").getBoundingClientRect().width;
  if (e.key === "ArrowLeft")  { setSide(cur - 16); e.preventDefault(); }
  if (e.key === "ArrowRight") { setSide(cur + 16); e.preventDefault(); }
};

/* ---------------------------------------------------------------- backup & restore */
const dialog = () => window.__TAURI__.dialog;
// The backend names evidence in English; the label a person reads follows the chosen language.
const EV = { "account file":"evAccountFile", "account store":"evAccountStore",
             "cookies (encrypted)":"evCookiesEnc", "cookies (plaintext)":"evCookiesPlain",
             "local web data":"evWebData" };
const evText = e => (EV[e] ? t(EV[e]) : e);
const human = b => { const u=["B","KB","MB","GB","TB"]; let v=b,i=0; while(v>=1024&&i<u.length-1){v/=1024;i++;} return i?`${v.toFixed(1)} ${u[i]}`:`${b} B`; };
// Whether the bash CLI is installed. Claude's conversation transfer runs through it, so that
// button is hidden rather than offered and then failing. Set once at start-up.
let hasCli = false;
let apps = [];

// Sizes arrive after the list is already on screen: the backend used to sum every byte before it
// answered, and Claude's tree alone is 15.9 GB.
// Kept between openings: Claude's folder alone takes six seconds to measure, and paying that every
// time the sheet opens is what made it feel slow. Rescan clears it.
const appSizeCache = new Map();
// Sizes are measured one row at a time, only for rows that are on screen, in the order they
// appeared. One worker drains the queue: twenty parallel disk walks make all twenty slower.
const sizeQueue = [];
let sizeWorker = null;
function queueSizes(els) {
  sizeQueue.push(...els);
  if (!sizeWorker) sizeWorker = drainSizes().finally(() => { sizeWorker = null; });
}
async function drainSizes() {
  while (sizeQueue.length) {
    const el = sizeQueue.shift();
    const a = apps[+el.dataset.sz];
    if (!a || !el.isConnected) continue;      // row gone (rescan, new search): skip its walk
    if (!appSizeCache.has(a.name)) {
      try { appSizeCache.set(a.name, await invoke("app_data_size", { app: a.name })); }
      catch { appSizeCache.set(a.name, null); }
    }
    const b = appSizeCache.get(a.name);
    el.textContent = b == null ? "—" : human(b);   // unreadable is not zero, never "0 B"
  }
}

// The list arrives in pages of 15. Building every row at once — and queueing a disk walk for every
// one of them — is what a Mac with a hundred apps paid for on each open. More rows load as the
// list is scrolled to its end; the search box finds an app without scrolling at all.
const PAGE = 15;
let toolsView = [], toolsShown = 0;

function appRow(a, i) {
  return `<div class="arow">
      <span class="n"><b>${esc(a.name)}</b><span>${esc(evText(a.evidence))} · <span class="sz" data-sz="${i}">${esc(t("measuring"))}</span></span></span>
      <span class="ra">
        ${hasCli && a.name.toLowerCase() === "claude" ? `<button class="btn ghost" data-conv="${i}">${esc(t("convBtn"))}</button>` : ""}
        <button class="btn ghost" data-bk="${i}">${esc(t("bkBtn"))} ▾</button>
        <button class="btn ghost" data-rs="${i}">${esc(t("rsBtn"))}</button>
      </span>
      <div class="hint rs" id="rs${i}"></div>
    </div>`;
}

function showMoreApps() {
  const box = $("appList");
  const next = toolsView.slice(toolsShown, toolsShown + PAGE);
  const before = box.children.length;
  box.insertAdjacentHTML("beforeend", next.map(i => appRow(apps[i], i)).join(""));
  const added = [...box.children].slice(before);
  added.forEach((el, k) => { el.style.animationDelay = `${Math.min(k, 10) * 18}ms`; });
  toolsShown += next.length;
  queueSizes(added.map(el => el.querySelector("[data-sz]")));
  const more = $("appMore");
  more.textContent = !toolsView.length ? (apps.length ? t("noMatch") : "")
    : toolsShown < toolsView.length ? `${toolsShown} / ${toolsView.length} — ${t("scrollMore")}` : "";
  // A tall window can show the whole first page with nothing to scroll; keep filling it.
  if (toolsShown < toolsView.length && toolsSheet.scrollHeight <= toolsSheet.clientHeight + 140) showMoreApps();
}

function filterApps() {
  const q = $("tFind").value.trim().toLowerCase();
  toolsView = apps.map((_, i) => i).filter(i => !q || apps[i].name.toLowerCase().includes(q));
  toolsShown = 0;
  sizeQueue.length = 0;
  $("appList").innerHTML = "";
  showMoreApps();
}

// Reaching the bottom of the sheet loads the next page. A plain scroll check, not an
// IntersectionObserver: the observer stays silent in a window that is not being painted.
const toolsSheet = document.querySelector("#bdTools .modal");
function nearEnd() {
  return toolsSheet.scrollTop + toolsSheet.clientHeight >= toolsSheet.scrollHeight - 140;
}
toolsSheet.addEventListener("scroll", () => {
  if (toolsShown < toolsView.length && nearEnd()) showMoreApps();
}, { passive: true });

// `keep` = a rescan: the rows stay where they are under a spinner until the new list is in, so
// the sheet neither empties nor jumps.
async function loadApps(keep = false) {
  const box = $("appList"), busy = $("toolsBusy");
  if (keep && box.children.length) {
    // cover the part of the sheet in view, wherever it has been scrolled to
    busy.style.top = `${toolsSheet.scrollTop}px`;
    busy.style.height = `${toolsSheet.clientHeight}px`;
    busy.hidden = false;
  } else {
    box.innerHTML = `<div class="note">${esc(t("scanning"))}</div>`;
    $("appMore").textContent = "";
    toolsView = []; toolsShown = 0;
  }
  try {
    apps = await invoke("list_app_data");
  } catch (e) { busy.hidden = true; box.innerHTML = `<div class="hint bad">${esc(String(e))}</div>`; return; }
  busy.hidden = true;
  if (!apps.length) { box.innerHTML = `<div class="note">${esc(t("noApps"))}</div>`; return; }
  const top = toolsSheet.scrollTop;
  filterApps();
  if (keep) toolsSheet.scrollTop = top;
}
$("tFind").oninput = filterApps;

// One handler for every row, however many pages have loaded. Each row reports in its own status
// line, so the result shows next to the app it is about, wherever the list is scrolled.
$("appList").onclick = e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const d = btn.dataset;
  if (d.bk !== undefined) {
    e.stopPropagation();
    const m = $("bkMenu"), wasOpen = m.classList.contains("open") && bkRow === +d.bk;
    closeMenus();
    if (!wasOpen) { bkRow = +d.bk; placeMenu(m, btn); }
  } else if (d.rs !== undefined) {
    restoreFromFile($(`rs${d.rs}`), apps[+d.rs].name);   // another app's file is refused
  } else if (d.conv !== undefined) {
    $("bdTools").classList.remove("open");
    openClaudeSessions();
  }
};
$("bkMenu").onclick = e => {
  e.stopPropagation();
  const b = e.target.closest("button[data-scope]");
  if (!b || bkRow === null) return;
  const i = bkRow;
  closeMenus();
  doBackup(apps[i], b.dataset.scope, $(`rs${i}`));
};

// A whole profile into one file. Restoring that file (Tools → Restore or import a file) brings the
// profile back under the same name — the same path the app-data backups take.
async function exportProfile(p) {
  try {
    const path = await dialog().save({
      title: t("exportProfile"),
      defaultPath: `multiapp-profile-${`${p.app}-${p.name}`.replace(/[^A-Za-z0-9._-]/g, "-")}.zip`,
      filters: [{ name: "Multiapp archive", extensions: ["zip"] }],
    });
    if (!path) return;
    lock(true);
    say(`${t("exporting")} ${p.app} · ${p.name}…`);
    const msg = await invoke("export_profile", { app: p.app, name: p.name, out: path });
    say(`${t("done")} — ${msg}. ${t("credentialWarning")}`, "ok");
  } catch (e) { say(e, "err"); }
  lock(false);
}

// scope: "login" | "sessions" | "everything" — one Restore button reads all three back.
async function doBackup(a, scope, st = $("bStatus")) {
  try {
    const suffix = { login: "login", sessions: "sessions", everything: "all" }[scope];
    const path = await dialog().save({
      title: t("saveAs"),
      defaultPath: `multiapp-${a.name.replace(/[^A-Za-z0-9._-]/g, "-")}-${suffix}.zip`,
      filters: [{ name: "Multiapp archive", extensions: ["zip"] }],
    });
    if (!path) return;
    st.textContent = `${t("backingUp")} ${a.name}…`; st.className = "hint";
    const msg = await invoke("backup_app", { app: a.name, out: path, scope });
    st.textContent = `${t("done")} — ${msg}`; st.className = "hint good";
    if (scope !== "sessions") say(t("credentialWarning"));   // a sessions file holds no login
  } catch (e) { st.textContent = String(e); st.className = "hint bad"; }
}

// One restore path for both sheets. `onlyFor` is set when the user came in through a specific
// app: an archive made for a different app is refused there rather than quietly restored into
// that other app while the sheet in front of them says something else.
// Archive kinds as written by the backend: "session" is the historical name of a login backup.
const kindText = k => t({ session: "kindLogin", data: "kindSessions", appdata: "kindAll" }[k] || "") || k;
async function restoreFromFile(st, onlyFor = null) {
  try {
    const path = await dialog().open({
      title: t("chooseArchive"), multiple: false,
      filters: [{ name: "Multiapp archive", extensions: ["zip"] }],
    });
    if (!path) return;
    // show what is inside BEFORE writing anything
    const m = await invoke("archive_info", { path });
    if (onlyFor && String(m.app).toLowerCase() !== onlyFor.toLowerCase()) {
      st.textContent = `${t("wrongArchive")} ${m.app} ≠ ${onlyFor}`; st.className = "hint bad";
      return;
    }
    const ok = await dialog().confirm(
      `${t("archiveHolds")}: ${m.app} — ${kindText(m.kind)}, ${m.paths.length} path(s), ${m.os}, ${m.created}`,
      { title: t("restoreFrom"), kind: "warning" });
    if (!ok) return;
    st.textContent = t("restoring"); st.className = "hint";
    st.textContent = await invoke("restore_archive", { path });
    st.className = "hint good";
    refresh(true);   // a restored profile export belongs back in the main list
  } catch (e) { st.textContent = String(e); st.className = "hint bad"; }
}
$("bRestore").onclick = () => restoreFromFile($("bStatus"));


/* ---------------------------------------------------------------- Claude sessions
   The index files live inside a profile; the transcripts live in the real ~/.claude, OUTSIDE it.
   So a session is not a file to copy — the CLI mints new ids and duplicates the transcript, and
   this screen is a picker in front of that. */
let sess = [];
let toAccts = [];
const checked = new Set();   // survives filtering, so narrowing the list does not lose ticks

function profileTargets() {
  // "main" is the unprofiled install; the rest are this machine's claude profiles.
  return ["main", ...rows.filter(p => p.app.toLowerCase() === "claude").map(p => p.name)];
}

function fillTargets() {
  const targets = profileTargets();
  const opts = targets.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  const from = $("sFrom"), to = $("sTo");
  const keepFrom = from.value, keepTo = to.value;
  from.innerHTML = opts; to.innerHTML = opts;
  from.value = targets.includes(keepFrom) ? keepFrom : "main";
  // Same install is a valid destination now — between its account folders — so it is no longer
  // steered away from.
  to.value = targets.includes(keepTo) ? keepTo : from.value;
}

// 1 session / 2 sessions; Russian also needs 2–4 сессии vs 5+ сессий
function sessNoun(n) {
  // English "21 sessions" but Russian "21 сессия": the mod-10 rule is Russian-only
  if (lang !== "ru") return n === 1 ? t("sessWord1") : t("sessWord");
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return t("sessWord1");
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return t("sessWord2");
  return t("sessWord");
}
const shortId = id => id.split("/").map(x => x.slice(0, 8)).join("/");
function acctLabel(a) {
  const parts = [a.sessions ? `${a.sessions} ${sessNoun(a.sessions)}` : t("emptyFolder")];
  if (a.last && a.last !== "-") parts.push(`${t("lastWord")} ${a.last.slice(0, 10)}`);
  if (a.live) parts.push(t("usedToday"));
  const first = (a.titles || "").split(" | ")[0];
  return `${parts.join(" · ")}${first ? ` — ${first}` : ""}  (${shortId(a.id)})`;
}
const acctOption = a => `<option value="${esc(a.id)}" title="${esc(a.titles)}">${esc(acctLabel(a))}</option>`;

function sessStatus(msg, kind = "") { const s = $("sStatus"); s.textContent = msg; s.className = "hint " + kind; }
const sessPicks = () => [...document.querySelectorAll("#sList input:checked")].map(i => i.value);
const visibleSess = () => { const f = $("sFromAcct").value; return f ? sess.filter(s => s.account === f) : sess; };

function updateCount() {
  const n = sessPicks().length, v = visibleSess().length;
  $("sCount").textContent = v ? `${n} / ${v} ${t("selected")}` : "";
  $("sAll").textContent = n === v && v ? t("selectNone") : t("selectAll");
}

function markNeed() {
  const sel = $("sToAcct");
  sel.classList.toggle("need", !sel.hidden && !sel.value);
  // the explanation matters only when an account choice is actually on screen
  $("sAcctNote").hidden = sel.hidden && $("sFromAcct").hidden;
}

// Every read below can be overtaken by a newer one (switching profiles quickly). Picks are
// POSITIONS in a list, so a stale answer painting over a newer one would transfer the wrong
// sessions. Only the newest read of each kind may paint.
let sessSeq = 0, fromSeq = 0, toSeq = 0;

function renderSess() {
  const box = $("sList"), list = visibleSess();
  const many = new Set(sess.map(s => s.account)).size > 1 && !$("sFromAcct").value;
  if (!list.length) {
    box.innerHTML = `<div class="note m6">${esc(t("noSessionsIn"))} '${esc($("sFrom").value)}'</div>`;
    updateCount();
    return;
  }
  box.innerHTML = list.map(s => `<label class="srow">
      <input type="checkbox" value="${s.index}"${checked.has(String(s.index)) ? " checked" : ""}>
      <span class="st"><b>${esc(s.title)}</b><span>${esc(s.date)}${many ? ` · ${esc(shortId(s.account))}` : ""} · ${esc(s.cwd)}</span></span>
    </label>`).join("");
  box.querySelectorAll("input").forEach(i => {
    i.onchange = () => { i.checked ? checked.add(i.value) : checked.delete(i.value); updateCount(); };
  });
  updateCount();
}

async function loadSessions() {
  const box = $("sList"), from = $("sFrom").value;
  const mine = ++sessSeq;
  sess = []; checked.clear();
  box.innerHTML = `<div class="note m6">${esc(t("loadingSessions"))}</div>`;
  updateCount();
  try {
    const got = await invoke("claude_sessions", { profile: from });
    if (mine !== sessSeq) return;
    sess = got;
  } catch (e) {
    if (mine !== sessSeq) return;
    // The CLI failing and the profile being empty are different facts, and this says which.
    box.innerHTML = `<div class="hint bad m6">${esc(String(e))}</div>`;
    return;
  }
  renderSess();
}

async function loadFromAccounts() {
  const mine = ++fromSeq, sel = $("sFromAcct"), keep = sel.value;
  let accts = [];
  try { accts = await invoke("claude_accounts", { profile: $("sFrom").value }); } catch (_) { accts = []; }
  if (mine !== fromSeq) return;
  const holding = accts.filter(a => a.sessions);
  sel.innerHTML = `<option value="">${esc(t("allAccounts"))}</option>` + holding.map(acctOption).join("");
  sel.value = holding.some(a => a.id === keep) ? keep : "";
  sel.hidden = holding.length <= 1;   // one account holding sessions: nothing to filter by
  markNeed();
  renderSess();
}

async function loadToAccounts() {
  const mine = ++toSeq, sel = $("sToAcct"), keep = sel.value;
  let accts = [];
  try { accts = await invoke("claude_accounts", { profile: $("sTo").value }); } catch (_) { accts = []; }
  if (mine !== toSeq) return;
  toAccts = accts;
  if (accts.length <= 1) {
    sel.innerHTML = accts.map(acctOption).join("");
    sel.value = accts.length ? accts[0].id : "";
    sel.hidden = true;
  } else {
    // Pre-picked only on evidence: the one folder the RUNNING Claude of that install has written
    // since it started. Never by recency or by where a session was created — that guess sent 56
    // copies into the other organisation's folder, where the app does not look.
    sel.innerHTML = `<option value="">${esc(t("chooseAccount"))}</option>` + accts.map(acctOption).join("");
    const live = accts.filter(a => a.live);
    sel.value = accts.some(a => a.id === keep) ? keep : (live.length === 1 ? live[0].id : "");
    sel.hidden = false;
  }
  markNeed();
}

function openClaudeSessions() {
  closeMenus();
  sessStatus("");
  fillTargets();
  $("bdSessions").classList.add("open");
  loadSessions(); loadFromAccounts(); loadToAccounts();
}

$("sDone").onclick = () => $("bdSessions").classList.remove("open");
// Claude's conversations are only reached from Claude's row in Tools, so Back goes there.
$("sBack").onclick = () => { $("bdSessions").classList.remove("open"); $("bdTools").classList.add("open"); };
$("sFrom").onchange = () => { loadSessions(); loadFromAccounts(); };
$("sTo").onchange = () => loadToAccounts();
$("sFromAcct").onchange = () => renderSess();
$("sToAcct").onchange = () => { sessStatus(""); markNeed(); };
$("sAll").onclick = () => {
  const on = sessPicks().length !== visibleSess().length;
  document.querySelectorAll("#sList input").forEach(i => { i.checked = on; on ? checked.add(i.value) : checked.delete(i.value); });
  updateCount();
};

$("sTransfer").onclick = async () => {
  const from = $("sFrom").value, to = $("sTo").value, picks = sessPicks();
  const toAcct = $("sToAcct").value;
  if (!picks.length) return sessStatus(t("pickSome"), "bad");
  if ((from === to || toAccts.length > 1) && !toAcct) { markNeed(); return sessStatus(t("pickAccount"), "bad"); }
  if (from === to && picks.every(ix => (sess.find(s => String(s.index) === ix) || {}).account === toAcct)) {
    return sessStatus(t("alreadyThere"), "bad");
  }
  // Writing into another account is not undoable from here, so it is confirmed first.
  const target = toAccts.find(a => a.id === toAcct);
  const question = target && (from === to || toAccts.length > 1)
    ? t("confirmTransferAcct").replace("__N__", picks.length).replace("__T__", to).replace("__A__", acctLabel(target))
    : t("confirmTransfer").replace("__N__", picks.length).replace("__T__", to);
  const ok = await dialog().confirm(question, { title: t("sessionsTitle"), kind: "warning" });
  if (!ok) return;
  sessStatus(t("transferring"));
  try {
    const msg = await invoke("transfer_sessions", { from, to, picks: picks.join(","), toAccount: toAcct || null });
    sessStatus(`${msg.trim()}\n${t("restartDest")}`.replace(/\n+/g, " — "), "good");
    loadSessions(); loadFromAccounts(); loadToAccounts();   // counts changed
  } catch (e) { sessStatus(String(e), "bad"); }
};

$("sExport").onclick = async () => {
  const from = $("sFrom").value, picks = sessPicks();
  if (!picks.length) return sessStatus(t("pickSome"), "bad");
  try {
    const out = await dialog().save({
      title: t("saveSessions"),
      defaultPath: `multiapp-claude-${from.replace(/[^A-Za-z0-9._-]/g, "-")}-${stamp()}.tar.gz`,
      filters: [{ name: "Multiapp sessions", extensions: ["gz", "tar.gz"] }],
    });
    if (!out) return;
    sessStatus(t("exporting"));
    const msg = await invoke("export_sessions", { profile: from, out, picks: picks.join(",") });
    sessStatus(msg.trim(), "good");
    say(t("sessionsPrivacy"));
  } catch (e) { sessStatus(String(e), "bad"); }
};

$("sImport").onclick = async () => {
  const to = $("sTo").value;
  try {
    const file = await dialog().open({
      title: t("chooseSessionFile"), multiple: false,
      filters: [{ name: "Multiapp sessions", extensions: ["gz", "tar.gz"] }],
    });
    if (!file) return;
    const ok = await dialog().confirm(t("confirmImport").replace("__T__", to),
      { title: t("sessionsTitle"), kind: "warning" });
    if (!ok) return;
    sessStatus(t("importing"));
    const msg = await invoke("import_sessions", { profile: to, file });
    sessStatus(`${msg.trim()} — ${t("restartDest")}`, "good");
  } catch (e) { sessStatus(String(e), "bad"); }
};

/* ---------------------------------------------------------------- trash */
async function updateTrashBadge() {
  try {
    const n = await invoke("trash_count");
    const b = $("trashBadge");
    b.textContent = n > 99 ? "99+" : String(n);
    b.hidden = n === 0;
  } catch (_) {}
}

let trashItems = [];
function trashStatus(msg, kind = "") { const s = $("trashStatus"); s.textContent = msg; s.className = "hint " + kind; }

function trashRow(it, i) {
  const when = it.deleted_at ? `${t("deletedWord")} ${it.deleted_at}` : "";
  let icon = "•", title = it.id, bits = [];
  if (it.kind === "profile") {
    icon = "◉"; title = `${it.app || t("unknownApp")} · ${it.name || it.id}`; bits = [t("kProfile")];
  } else if (it.kind === "sessions") {
    icon = "✦"; title = `${it.sessions} ${t("kSessions")}`;
    if (it.titles.length) bits = [it.titles.slice(0, 3).join(", ") + (it.sessions > 3 ? "…" : "")];
  } else if (it.kind === "replaced") {
    icon = "↺"; title = it.app ? `${t("kReplaced")} · ${it.app}` : t("kReplaced");
  } else {
    bits = [t("kOther")];
  }
  if (when) bits.push(when);
  bits.push(human(it.bytes));
  return `<div class="arow">
      <span class="kind ${esc(it.kind)}">${icon}</span>
      <span class="n"><b title="${esc(it.id)}">${esc(title)}</b><span>${esc(bits.join(" · "))}</span></span>
      ${it.restorable ? `<button class="btn ghost" data-restore="${i}">${esc(t("restore"))}</button>` : ""}
      <button class="btn ghost" data-reveal="${i}">${esc(t("open"))}</button>
    </div>`;
}

async function loadTrash() {
  const box = $("trashList");
  box.innerHTML = `<div class="note">${esc(t("readingTrash"))}</div>`;
  try { trashItems = await invoke("trash_list"); }
  catch (e) { box.innerHTML = `<div class="hint bad">${esc(String(e))}</div>`; return; }
  $("trashEmpty").disabled = !trashItems.length;
  if (!trashItems.length) { box.innerHTML = `<div class="note">${esc(t("trashEmptyNow"))}</div>`; updateTrashBadge(); return; }
  box.innerHTML = trashItems.map(trashRow).join("");
  stagger(box, ".arow", 18, 10);
  box.querySelectorAll("[data-restore]").forEach(b => { b.onclick = () => restoreTrash(trashItems[+b.dataset.restore]); });
  box.querySelectorAll("[data-reveal]").forEach(b => {
    b.onclick = () => invoke("trash_reveal", { id: trashItems[+b.dataset.reveal].id }).catch(e => trashStatus(String(e), "bad"));
  });
  updateTrashBadge();
}

async function restoreTrash(it) {
  try {
    const to = await invoke("trash_restore", { id: it.id });
    trashStatus(`${t("restoredTo")} ${to}`, "good");
    await loadTrash();
    refresh(true);   // the restored profile belongs back in the main list
  } catch (e) { trashStatus(String(e), "bad"); }
}

$("trashBtn").onclick = () => { closeMenus(); trashStatus(""); $("bdTrash").classList.add("open"); loadTrash(); };
$("trashClose").onclick = () => $("bdTrash").classList.remove("open");
$("trashEmpty").onclick = async () => {
  if (!trashItems.length) return;
  const total = trashItems.reduce((a, it) => a + it.bytes, 0);
  // The one irreversible action in the app: always confirmed, with what and how much.
  const ok = await dialog().confirm(
    t("emptyConfirm").replace("__N__", trashItems.length).replace("__S__", human(total)),
    { title: t("emptyTrash"), kind: "warning" });
  if (!ok) return;
  try {
    const msg = await invoke("trash_empty");
    trashStatus(`${t("emptied")} ${msg}`, "good");
    await loadTrash();
  } catch (e) { trashStatus(String(e), "bad"); await loadTrash(); }
};

$("bRescan").onclick = () => { appSizeCache.clear(); loadApps(true); };
$("advBtn").onclick = () => { closeMenus(); $("bStatus").textContent = ""; $("tFind").value = ""; $("bdTools").classList.add("open"); loadApps(); };
$("tClose").onclick = () => $("bdTools").classList.remove("open");

document.querySelectorAll(".backdrop").forEach(bd => {
  bd.onclick = e => { if (e.target === bd) bd.classList.remove("open"); };
});
document.addEventListener("keydown", e => {
  const open = document.querySelector(".backdrop.open");
  if (!open) return;
  if (e.key === "Escape") open.classList.remove("open");
  if (e.key === "Enter" && open === $("bdProfile")) $("pOk").click();
  if (e.key === "Enter" && open === $("bdConfirm")) $("cOk").click();
});

$("refresh").onclick = () => {
  $("refresh").classList.add("spin");
  // An explicit rescan is the one place sizes are taken again. The poll must not do it: walking
  // every profile tree every few seconds is the mistake that made the backup window unusable.
  sizeCache.clear();
  refresh(true).finally(() => setTimeout(() => $("refresh").classList.remove("spin"), 350));
};

/* ---------------------------------------------------------------- boot */
(async () => {
  loadPrefs(); applyLang();
  await refresh();
  $("advBtn").hidden = false;
  // Sessions need the macOS CLI. Showing a button that can only ever say "not installed" is worse
  // than not showing it, so the backend is asked first.
  try {
    hasCli = await invoke("advanced_available");
  } catch (_) {}
  updateTrashBadge();
  try {
    if (!(await invoke("in_start_menu")) && navigator.userAgent.includes("Windows")) $("pin").hidden = false;
  } catch (_) {}
})();
$("pin").onclick = async () => {
  try { await invoke("add_to_start_menu"); $("pin").hidden = true; say(t("addedStart"), "ok"); }
  catch (e) { say(e, "err"); }
};
// Polling exists so the running state stays true when an app is launched or quit outside Multiapp.
// It is skipped while a dialog or menu is open, while an action is in flight, and while the window
// is not focused — a window nobody is looking at does not need a process sweep every few seconds.
setInterval(() => {
  if (busy || openMenu || document.querySelector(".backdrop.open")) return;
  if (document.hidden || !document.hasFocus()) return;
  refresh();
}, 5000);
window.addEventListener("focus", () => { if (!busy) refresh(); });
</script>
</body>
</html>
